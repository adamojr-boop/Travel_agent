[project]
name = "travel-agent-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Mizzoni Adamo Junior",email = "adamojr@outlook.it"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi (>=0.156.8,<0.157.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "langchain (>=1.4.6,<2.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "tavily-python (>=0.8.5,<0.9.0)",
    "langchain-tavily (>=0.2.18,<0.3.0)"
]

[tool.poetry]
packages = [{include = "travel_agent_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
